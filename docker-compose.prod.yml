# MAKU production services. The host's existing Nginx terminates TLS and serves
# the built frontends; application ports bind only to loopback.
name: maku-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: maku-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: maku-api:latest
    container_name: maku-api
    restart: always
    env_file:
      - path: apps/api/.env.production
        required: false
    environment:
      NODE_ENV: production
      FRONTEND_PUBLIC_URL: https://maku.trendscore.co.ke
      FRONTEND_APP_URL: https://app.maku.trendscore.co.ke
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
