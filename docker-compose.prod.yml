# MAKU Platform — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# All services including Nginx are here.
# SSL certs managed by Certbot — run infra/scripts/init-letsencrypt.sh once on first deploy.

name: maku-prod

services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maku-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No external port exposure in production — only accessible inside Docker network

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maku-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: maku-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://files.maku.trendscore.co.ke
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: maku-api
    restart: always
    env_file:
      - path: apps/api/.env.production
        required: false
    environment:
      NODE_ENV: production
      FRONTEND_PUBLIC_URL: https://maku.trendscore.co.ke
      FRONTEND_APP_URL: https://app.maku.trendscore.co.ke
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Nginx (reverse proxy + static file server + SSL) ───────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: maku-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      # Built static files are baked into the image at build time;
      # in this compose they are mounted from a shared build volume.
      - web_app_dist:/var/www/maku-app:ro
      - web_public_dist:/var/www/maku-public:ro
    networks:
      default:
        aliases:
          - api.maku.trendscore.co.ke
          - app.maku.trendscore.co.ke
          - maku.trendscore.co.ke
          - files.maku.trendscore.co.ke
    depends_on:
      - api
      - minio

  # Build frontend bundles at deploy time and publish them into Nginx volumes.
  # This replaces the prior host-side pnpm build requirement.
  web-build:
    image: node:20-alpine
    container_name: maku-web-build
    profiles: ["build"]
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - web_app_dist:/output/app
      - web_public_dist:/output/public
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        corepack enable;
        pnpm install --frozen-lockfile;
        pnpm --filter @maku/web-app build;
        pnpm --filter @maku/web-public build;
        cp -R apps/web-app/dist/. /output/app/;
        cp -R apps/web-public/dist/. /output/public/

  # ─── Certbot (SSL cert renewal) ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: maku-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt_certs:/etc/letsencrypt
    # Run cert renewal via cron on the host or use: docker compose run certbot renew
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_webroot:
  letsencrypt_certs:
  web_app_dist:
  web_public_dist:
