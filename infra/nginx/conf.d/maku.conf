# ============================================================================
# MAKU Platform — Nginx Configuration
# Subdomains (testing on Trends CORE):
#   maku.trendscore.co.ke         → Public website (web-public)
#   app.maku.trendscore.co.ke     → Management app (web-app PWA)
#   api.maku.trendscore.co.ke     → NestJS API
#   files.maku.trendscore.co.ke   → MinIO file storage
#
# Replace trendscore.co.ke with maku.coop when the client domain is ready.
# Only these 4 lines need updating:
#   server_name maku.trendscore.co.ke;
#   server_name app.maku.trendscore.co.ke;
#   server_name api.maku.trendscore.co.ke;
#   server_name files.maku.trendscore.co.ke;
# ============================================================================

# ─── Redirect all HTTP → HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    server_name maku.trendscore.co.ke
                app.maku.trendscore.co.ke
                api.maku.trendscore.co.ke
                files.maku.trendscore.co.ke;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Public Website: maku.trendscore.co.ke ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name maku.trendscore.co.ke;

    ssl_certificate     /etc/letsencrypt/live/maku.trendscore.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maku.trendscore.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/maku-public;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' fonts.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com fonts.gstatic.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https: files.maku.trendscore.co.ke; connect-src 'self' api.maku.trendscore.co.ke;" always;

    # Cache static assets aggressively
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/maku-public-access.log;
    error_log  /var/log/nginx/maku-public-error.log warn;
}

# ─── Management App: app.maku.trendscore.co.ke ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.maku.trendscore.co.ke;

    ssl_certificate     /etc/letsencrypt/live/app.maku.trendscore.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.maku.trendscore.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/maku-app;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' fonts.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com fonts.gstatic.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https: files.maku.trendscore.co.ke; connect-src 'self' api.maku.trendscore.co.ke wss://app.maku.trendscore.co.ke;" always;

    # PWA: service worker must NOT be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static assets — cache aggressively (Vite includes content hash in filenames)
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/maku-app-access.log;
    error_log  /var/log/nginx/maku-app-error.log warn;
}

# ─── API: api.maku.trendscore.co.ke ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.maku.trendscore.co.ke;

    ssl_certificate     /etc/letsencrypt/live/api.maku.trendscore.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.maku.trendscore.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # CORS — handled by NestJS, but Nginx adds preflight support
    add_header Vary "Origin" always;

    location / {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Pass cookies through (needed for refresh token HttpOnly cookie)
        proxy_cookie_path / "/; SameSite=None; Secure";
    }

    access_log /var/log/nginx/maku-api-access.log;
    error_log  /var/log/nginx/maku-api-error.log warn;
}

# ─── File Storage: files.maku.trendscore.co.ke ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name files.maku.trendscore.co.ke;

    ssl_certificate     /etc/letsencrypt/live/files.maku.trendscore.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.maku.trendscore.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Increase max body size for file uploads (up to 50 MB)
    client_max_body_size 50M;

    location / {
        proxy_pass         http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    access_log /var/log/nginx/maku-files-access.log;
    error_log  /var/log/nginx/maku-files-error.log warn;
}
