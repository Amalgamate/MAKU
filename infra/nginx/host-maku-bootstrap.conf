# Temporary HTTP route used only to issue the first MAKU TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name maku.trendscore.co.ke;
    root /home/deploy/apps/maku/apps/web-public/dist;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location /v1/ { proxy_pass http://127.0.0.1:3210; }
    location /api/ { proxy_pass http://127.0.0.1:3210; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.maku.trendscore.co.ke;
    root /home/deploy/apps/maku/apps/web-app/dist;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location /v1/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=None; Secure";
    }
    location /api/ { proxy_pass http://127.0.0.1:3210; }
    location / { try_files $uri $uri/ /index.html; }
}
