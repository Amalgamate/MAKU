name: Deploy MAKU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maku-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: maku
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build web apps and API image
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @maku/web-app build
          pnpm --filter @maku/web-public build
          docker build --target production --tag maku-api:latest --file apps/api/Dockerfile .

      - name: Configure passwordless SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/maku_deploy
          chmod 600 ~/.ssh/maku_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf 'Host maku-production\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/maku_deploy\n  IdentitiesOnly yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" >> ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          ssh maku-production 'mkdir -p /home/deploy/apps/maku'

      - name: Stop Odoo and remove its images
        run: |
          ssh maku-production 'bash -s' <<'REMOTE'
          set -euo pipefail
          mapfile -t odoo_images < <(sudo docker image ls --format "{{.Repository}}:{{.Tag}}" | awk '$1 ~ /^odoo:/')
          for image in "${odoo_images[@]}"; do
            mapfile -t containers < <(sudo docker ps -aq --filter "ancestor=${image}")
            if ((${#containers[@]})); then
              mapfile -t running < <(sudo docker ps -q --filter "ancestor=${image}")
              if ((${#running[@]})); then sudo docker stop "${running[@]}"; fi
              sudo docker rm "${containers[@]}"
            fi
          done
          if ((${#odoo_images[@]})); then sudo docker image rm "${odoo_images[@]}"; fi
          echo 'Odoo containers stopped and removed; Odoo images removed. Docker volumes were preserved.'
          REMOTE

      - name: Reclaim space from unused older images
        run: ssh maku-production 'sudo docker image prune --all --force --filter until=48h'

      - name: Report production storage usage
        run: ssh maku-production 'df -h /; sudo docker system df; sudo du -xhd1 /var/lib/docker /var/log /home/deploy 2>/dev/null | sort -h | tail -20'

      - name: Sync source and built web apps to the server
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='apps/*/node_modules/' \
            --exclude='.env' \
            --exclude='apps/api/.env.production' \
            ./ maku-production:/home/deploy/apps/maku/

      - name: Transfer production API image
        run: docker save maku-api:latest | gzip -1 | ssh maku-production 'gzip -dc | sudo docker load'

      - name: Prepare one-time admin bootstrap
        env:
          MAKU_ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.MAKU_ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MAKU_ADMIN_BOOTSTRAP_PASSWORD" ]]; then
            echo 'MAKU_ADMIN_BOOTSTRAP_PASSWORD is not set; administrator bootstrap will be skipped.'
            exit 0
          fi
          if [[ ${#MAKU_ADMIN_BOOTSTRAP_PASSWORD} -lt 12 ]]; then
            echo 'MAKU_ADMIN_BOOTSTRAP_PASSWORD must be at least 12 characters.' >&2
            exit 1
          fi
          printf '%s\n' "$MAKU_ADMIN_BOOTSTRAP_PASSWORD" | ssh maku-production \
            'umask 077; cat > /dev/shm/maku-admin-bootstrap'

      - name: Deploy and verify
        run: ssh maku-production 'cd /home/deploy/apps/maku && chmod +x infra/scripts/*.sh && ./infra/scripts/deploy.sh'
